<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1A18" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--app-head-->
    <script>
      // Desktop home: keep the sidebar hidden until the hero collapse engine
      // has placed its nodes, so nothing flashes in the wrong place.
      (function () {
        var p = location.pathname.split('/').filter(Boolean);
        var home = p.length <= 1;
        var desk = matchMedia('(min-width: 901px) and (min-height: 561px), (min-width: 901px) and (pointer: fine)').matches;
        var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (home && desk && !calm) {
          document.documentElement.classList.add('pre-ghost');
          setTimeout(function () { document.documentElement.classList.remove('pre-ghost'); }, 3000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
